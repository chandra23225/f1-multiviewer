<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Live Formula 1 multiviewer — timing, standings, telemetry & weather powered by OpenF1" />
  <title>F1 Multiviewer</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/panels.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────── -->
  <header class="header">
    <div class="f1-logo" aria-label="Formula 1">F1</div>
    <span class="header-title">Multiviewer</span>
    <div class="header-actions">
      <span id="dataSourceBadge" class="data-badge data-badge--historical" aria-live="polite">⏱ LAST SESSION</span>
      <button class="refresh-btn" id="refreshBtn" aria-label="Refresh data">↻ Refresh</button>
    </div>
  </header>

  <!-- ── Session Info Bar ─────────────────────────────────────── -->
  <div class="session-bar" role="status" aria-label="Session information">
    <span class="item">Round <strong id="roundNum">—</strong></span>
    <span class="item">Circuit <strong id="circuitName">Loading…</strong></span>
    <span class="item">Session <strong id="sessionType">—</strong></span>
    <span class="item">Year <strong id="sessionYear">—</strong></span>
    <span class="last-refresh">
      Last updated: <span id="lastRefresh">—</span>
    </span>
  </div>

  <!-- ── Main Grid ────────────────────────────────────────────── -->
  <main class="grid" role="main">

    <!-- Live Timing -->
    <section class="panel" aria-label="Live Timing"></section>
      <div class="panel-header">
        <div class="panel-dot" aria-hidden="true"></div>
        Live Timing
        <span id="timingNote" class="panel-note"></span>
      </div>
      <div id="timingPanel"></div>
    </section>

    <!-- Driver Standings -->
    <section class="panel" aria-label="Driver Standings">
      <div class="panel-header">
        <div class="panel-dot" aria-hidden="true"></div>
        Driver Standings
        <span class="panel-note" style="margin-left:auto">Current season</span>
      </div>
      <div id="standingsPanel"></div>
    </section>

    <!-- Car Telemetry -->
    <section class="panel" aria-label="Car Telemetry">
      <div class="panel-header">
        <div class="panel-dot" aria-hidden="true"></div>
        Car Telemetry
        <div class="panel-extra">
          <span id="telemDriverLabel"></span>
          <span id="telemNote" class="panel-note"></span>
        </div>
      </div>
      <div id="telemPanel"></div>
    </section>

    <!-- Track & Weather -->
    <section class="panel" aria-label="Track and Weather">
      <div class="panel-header">
        <div class="panel-dot" aria-hidden="true"></div>
        Track &amp; Weather
        <span id="weatherNote" class="panel-note"></span>
      </div>
      <div id="weatherPanel"></div>
    </section>

  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
